name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Clean-install wheel and smoke-test API and CLI
        run: |
          python -m venv /tmp/wrapevofs-release-test
          /tmp/wrapevofs-release-test/bin/python -m pip install --upgrade pip
          /tmp/wrapevofs-release-test/bin/python -m pip install dist/*.whl
          /tmp/wrapevofs-release-test/bin/python -c "import wrapevofs; assert wrapevofs.__version__ == '0.2.0'"
          /tmp/wrapevofs-release-test/bin/wrapevofs --help
