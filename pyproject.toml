[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapevofs"
version = "0.2.0"
description = "Auditable stochastic feature compression with regret-constrained representative locking."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Junseo Park" }
]
keywords = ["feature-selection", "genetic-algorithm", "machine-learning", "reproducibility", "stability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10"
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
boruta = ["boruta>=0.3"]
gpu = [
  "cupy-cuda12x; platform_system == 'Linux'",
  "cudf-cu12; platform_system == 'Linux'",
  "cuml-cu12; platform_system == 'Linux'"
]
all = ["xgboost>=2.0", "boruta>=0.3"]
dev = ["build>=1.2", "pytest>=7.4", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/junseoparkX/wrapevofs-package"
Repository = "https://github.com/junseoparkX/wrapevofs-package"
Documentation = "https://github.com/junseoparkX/wrapevofs-package#readme"

[project.scripts]
wrapevofs = "wrapevofs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
